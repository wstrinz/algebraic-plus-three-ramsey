      note: "Points in the plane; centre and radius arbitrary; T is the set of indices of the at most three arbitrary points."
    - source: "spherical-ramsey v1.1.0, note/spherical-ramsey.tex, Theorem B(b) (Mathlib vocabulary)"
      lean: "AlgebraicPlusThree.ramsey_alg_plus_three_mathlib"
      module: "AlgebraicPlusThree.MathlibStatement"
      status: "proved"
    - source: "spherical-ramsey v1.1.0, note/spherical-ramsey.tex, Theorem B(a) (prior work, JD-Jones-ASES)"
      lean: "OAI.EuclideanRamsey.circle_ramsey_of_le_six"
      module: "AlgebraicPlusThree.SixPoint"
