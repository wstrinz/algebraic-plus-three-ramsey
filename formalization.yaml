status:
  scope: >-
    Formalized: Theorem B(b) for an injective family of points of
    EuclideanSpace R (Fin 2) on some circle (any centre and radius), with
    algebraic coordinates outside a set T of at most three indices
    (ramsey_alg_plus_three), its Mathlib-vocabulary restatement
    (ramsey_alg_plus_three_mathlib), and the six-point theorem it uses
    (circle_ramsey_of_le_six). A small satisfiability witness with T nonempty
    (ramsey_alg_plus_three_nonvacuous) is proved but not advertised. Not formalized: the extension to circles in
    higher-dimensional spaces and to sets congruent to such configurations (by
    the congruence invariance of Ramsey, by hand); the extension to Möbius
    images (with mobius-ramsey's Theorem C, by hand); the sharpness of "three"
    (Pálvölgyi's Theorem A.3).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OAI.EuclideanRamsey.ramsey_alg_plus_three"
      file: "AlgebraicPlusThree/AlgPlusThree.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "AlgebraicPlusThree.ramsey_alg_plus_three_mathlib"
      file: "AlgebraicPlusThree/MathlibStatement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A coordinating Claude Opus 5.5 session dispatched bounded Claude Opus 5.5
        agents, each in its own git worktree: the Lean proofs on top of OpenAI's
        development (Lean 4, Mathlib, lake build, #print axioms) for
        spherical-ramsey, with stock Comparator runs and negative controls; the
        non-builder fidelity review; the module-system port and this package,
        built and checked on GitHub-hosted runners (lake comparator with three
        kernels, five negative controls).
        Exact computer-algebra certificates (Python, SymPy) were used while
        exploring.
      cost:
        wall_time: "not recorded separately for this result; the port and this package took one working session"
        spend_usd: "subscription-based"
        hardware: "one desktop machine (Windows and WSL Ubuntu); GitHub-hosted runners"
      prompting_notes: >-
        Written task packets with explicit status tags, time boxes and hard rules
        (no weakened statements, no added hypotheses, standard axioms only, no
        sorry or native_decide).
    - method: "agent"
      models: ["claude-sonnet-5-5"]
      framework: "Claude Code"
      tool_setup: "Read-only agents for the prior-work searches (arXiv, GitHub, MathOverflow, bibliographic databases) and for a fresh reproduction of the originating release from its README and REPRODUCE alone."
    - method: "other"
      models: []
      framework: "Claude (chat)"
      tool_setup: "The exploratory conversation (claude.ai, Claude Opus 5.5) in which most of the originating release's claims first appeared."
  spend_usd: "subscription-based"
  notes: >-
    Will Strinz directed the work and made every release decision; he reviewed
    the originating note before its release, not line by line (an owner's
    review, not expert review). The proofs, the port and the checks were
    produced by AI agents. See DISCLOSURE.md.

fidelity:
  divergences: >-
    Ramsey, Congruent and Space are OpenAI's definitions, verbatim; the
    statements add no definitions (Mathlib's EuclideanSpace R (Fin 2),
    Metric.sphere, Finset.card and IsAlgebraic only). OpenAI's Congruent and
    Mathlib's are proved equivalent. The theorem is stated for the plane and for
    algebraic coordinates in the given frame; circles in higher-dimensional
    spaces and congruent copies are covered by the congruence invariance of
    Ramsey, by hand. The set is an injective family Fin s -> plane, and the at
    most three exceptional points are given by a Finset of indices. Item-by-item
    table: docs/FIDELITY.md.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (non-builder review of this package's statements and documentation)"
    - "Claude Opus 5.5 (non-builder fidelity review of the statements, rope version)"
    - "Claude Sonnet 5.5 (fresh reproduction of the rope version)"
  notes: >-
    The port's statements and documentation were reviewed by a further Claude
    Opus 5.5 agent that did not build them (statements identical to the rope's;
    documentation fixes applied). Before that, the rope's statements were
    reviewed by a Claude Opus 5.5 agent that did not build the rope (faithful;
    fixes to the fidelity note only, applied), and a Claude Sonnet 5.5 agent
    reproduced the rope from its README alone. The port is also checked
    mechanically (lake comparator with three kernels against a Mathlib-only
    Challenge.lean, five negative controls refused, statement comparison with
    the rope's challenges). No independent human expert review.

alignment:
  namespace: "OAI.EuclideanRamsey, AlgebraicPlusThree"
  statements:
