name: Palomar preflight

# Runs Palomar's own reusable verification workflow (mode: full) against a chosen commit,
# as Palomar's submission protocol requires before submitting. Predictive only; no Palomar
# state or credentials are involved.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit to preflight
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
